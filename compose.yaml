services:
  nostalgia:
    image: nostalgia:mvp
    build:
      context: .
      args:
        PYTHON_IMAGE: ${NOSTALGIA_PYTHON_IMAGE:-python:3.11-slim}
    ports:
      - "127.0.0.1:${NOSTALGIA_PUBLISHED_PORT:-8000}:8000"
    environment:
      NOSTALGIA_TOKENS_JSON: ${NOSTALGIA_TOKENS_JSON:?Set a JSON mapping of bearer tokens to user IDs}
      NOSTALGIA_DREAMING_ENABLED: ${NOSTALGIA_DREAMING_ENABLED:-false}
      NOSTALGIA_DREAMING_INTERVAL_SECONDS: ${NOSTALGIA_DREAMING_INTERVAL_SECONDS:-600}
      NOSTALGIA_DREAMING_PROVIDER_URL: ${NOSTALGIA_DREAMING_PROVIDER_URL:-}
      NOSTALGIA_DREAMING_PROVIDER_TOKEN_FILE: ${NOSTALGIA_DREAMING_PROVIDER_TOKEN_FILE:-}
      NOSTALGIA_DREAMING_BATCH_MAX_RECORDS: ${NOSTALGIA_DREAMING_BATCH_MAX_RECORDS:-100}
      NOSTALGIA_DREAMING_BATCH_MAX_CHARS: ${NOSTALGIA_DREAMING_BATCH_MAX_CHARS:-200000}
      NOSTALGIA_DREAMING_DRAFT_TIMEOUT_SECONDS: ${NOSTALGIA_DREAMING_DRAFT_TIMEOUT_SECONDS:-1800}
    volumes:
      - nostalgia-data:/data
    restart: unless-stopped

volumes:
  nostalgia-data:
